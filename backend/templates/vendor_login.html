<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vendor Login - ShopNearby AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #764ba2,
                #667eea
            );

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .login-box {

            width: 400px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);

        }

        .logo {

            text-align: center;

            font-size: 50px;

            margin-bottom: 10px;

        }

        h1 {

            text-align: center;

            color: #333;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

        }

        .form-group {

            margin-bottom: 18px;

        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;

        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

        }

        input:focus {

            outline: none;

            border-color: #764ba2;

        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #764ba2;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #653b8f;

        }

        button:disabled {

            background: #999;

            cursor: not-allowed;

        }

        #message {

            text-align: center;

            margin-bottom: 15px;

            min-height: 20px;

        }

        .success {

            color: green;

        }

        .error {

            color: red;

        }

        .register {

            text-align: center;

            margin-top: 20px;

            color: #666;

        }

        .register a {

            color: #764ba2;

            text-decoration: none;

            font-weight: bold;

        }

        .back {

            text-align: center;

            margin-top: 15px;

        }

        .back a {

            color: #666;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">

        🏪

    </div>


    <h1>

        Vendor Login

    </h1>


    <p class="subtitle">

        Login to manage your shop,
        products and inventory

    </p>


    <div id="message"></div>


    <form id="vendorLoginForm">


        <div class="form-group">

            <label for="email">

                Email

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            id="loginButton">

            🔐 Vendor Login

        </button>


    </form>


    <div class="register">

        New Vendor?

        <a href="/vendor-register">

            Create Shop Account

        </a>

    </div>


    <div class="back">

        <a href="/">

            ← Back to Login Selection

        </a>

    </div>


</div>



<script>

document
.getElementById("vendorLoginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document
        .getElementById("message");


    const button =
        document
        .getElementById("loginButton");


    button.disabled = true;

    button.innerHTML =
        "🔄 Logging in...";


    message.className = "";

    message.innerHTML =
        "Please wait...";


    try {


        const response =
            await fetch("/login", {

                method: "POST",

                credentials: "include",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    email: email,

                    password: password,

                    role: "vendor"

                })

            });


        const data =
            await response.json();


        console.log(
            "LOGIN RESPONSE:",
            data
        );


        if (
            response.ok &&
            data.success
        ) {


            message.className =
                "success";


            message.innerHTML =
                "✅ Login successful!";


            /*
             * IMPORTANT:
             * Directly move to dashboard.
             */

            window.location.href =
                "/vendor-dashboard";


            return;

        }


        message.className =
            "error";


        message.innerHTML =
            "❌ " +
            (
                data.error ||
                "Login failed"
            );


        button.disabled = false;

        button.innerHTML =
            "🔐 Vendor Login";

    }


    catch(error) {


        console.error(
            "LOGIN ERROR:",
            error
        );


        message.className =
            "error";


        message.innerHTML =
            "❌ Server connection error";


        button.disabled = false;

        button.innerHTML =
            "🔐 Vendor Login";

    }

});

</script>


</body>

</html>
