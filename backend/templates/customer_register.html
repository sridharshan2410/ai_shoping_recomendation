<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration - ShopNearby AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 0;
        }

        .register-box {
            width: 430px;
            max-width: 92%;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #444;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .register-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-btn:hover {
            background: #5568d8;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .login-link a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .back {
            text-align: center;

            margin-top: 15px;
        }

        .back a {
            color: #666;

            text-decoration: none;
        }

        #message {
            text-align: center;

            margin-bottom: 15px;

            font-size: 14px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>

</head>

<body>

    <div class="register-box">

        <div class="logo">
            👤
        </div>

        <h1>Customer Registration</h1>

        <p class="subtitle">
            Create your ShopNearby AI account
        </p>


        <div id="message"></div>


        <form onsubmit="customerRegister(event)">

            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Phone -->
            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    maxlength="15"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn">

                👤 Create Customer Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="/customer-login">
                Customer Login
            </a>

        </div>


        <div class="back">

            <a href="/">
                ← Back to Login Selection
            </a>

        </div>

    </div>


    <script>

        async function customerRegister(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            message.innerHTML = "";


            // Check password
            if (password !== confirmPassword) {

                message.className = "error";

                message.innerHTML =
                    "❌ Passwords do not match.";

                return;
            }


            try {

                const response = await fetch("/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name: name,

                        email: email,

                        phone: phone,

                        password: password,

                        role: "customer"

                    })

                });


                const data = await response.json();


                if (response.ok) {

                    message.className = "success";

                    message.innerHTML =
                        "✅ Registration successful!";


                    setTimeout(() => {

                        window.location.href =
                            "/customer-login";

                    }, 1000);

                }

                else {

                    message.className = "error";

                    message.innerHTML =
                        "❌ " +
                        (data.error ||
                         "Registration failed.");

                }

            }

            catch (error) {

                console.error(error);

                message.className = "error";

                message.innerHTML =
                    "❌ Server connection error.";

            }

        }

    </script>

</body>

</html>
