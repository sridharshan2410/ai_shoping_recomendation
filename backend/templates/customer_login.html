<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login - ShopNearby AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 18px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;

            background: #667eea;
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d8;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #666;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            👤
        </div>

        <h1>Customer Login</h1>

        <p class="subtitle">
            Login to find nearby products and stores
        </p>

        <div id="message"></div>

        <form onsubmit="customerLogin(event)">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-btn">
                🔐 Login
            </button>

        </form>

        <div class="register">
            New Customer?
            <a href="/customer-register">
                Create Account
            </a>
        </div>

        <div class="back">
            <a href="/">
                ← Back to Login Selection
            </a>
        </div>

    </div>


    <script>

        async function customerLogin(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            message.innerHTML = "";

            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password,
                        role: "customer"
                    })

                });

                const data = await response.json();

                if (response.ok) {

                    message.className = "success";

                    message.innerHTML =
                        "✅ Login successful!";

                    setTimeout(() => {

                        window.location.href =
                            "/customer-dashboard";

                    }, 500);

                } else {

                    message.className = "error";

                    message.innerHTML =
                        "❌ " + (data.error || "Login failed");

                }

            } catch (error) {

                message.className = "error";

                message.innerHTML =
                    "❌ Server connection error.";

                console.error(error);
            }
        }

    </script>

</body>

</html>
